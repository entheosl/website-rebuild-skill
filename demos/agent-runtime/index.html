<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e9dfc9"><title>Mosaic Assembly</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9cfb9;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between;color:#3d372d}.top{display:flex;justify-content:space-between;align-items:flex-start}.tag{font-size:10px;letter-spacing:.22em;font-weight:700;opacity:.6}.title{margin-top:6px;font-size:clamp(24px,7vw,46px);font-weight:750;letter-spacing:-.045em}.hint{font-size:11px;opacity:.55;text-align:right;line-height:1.5}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:3px;flex:1;max-width:320px;background:#645b4c22;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#4d6e68;border-radius:4px}.replay{pointer-events:auto;border:1px solid #514a3d33;background:#f7f0e2aa;backdrop-filter:blur(8px);border-radius:999px;padding:9px 14px;font-size:11px;color:#3d372d;box-shadow:0 6px 24px #554a3820}.replay:active{transform:scale(.97)}@media(max-width:640px){.hint{display:none}.ui{padding:18px}.title{font-size:30px}}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="top"><div><div class="tag">BROWSER / PROCEDURAL MOSAIC</div><div class="title">Mosaic Assembly</div></div><div class="hint">DRAG · CAMERA<br>TAP · REPLAY</div></div><div class="bottom"><div class="progress"><i id="bar"></i></div><button class="replay" id="replay">重新拼一次</button></div></div><script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D=1,t0=performance.now(),start=t0,dragX=0,dragY=0,tx=0,ty=0,down=false,lastX=0,lastY=0;const bar=document.querySelector('#bar');function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
const palette=['#315d57','#4d8175','#8ba998','#d5c79c','#d99b69','#b86d53','#80594d','#d9d0bb','#f1e7d1','#a5a08b','#6f806c','#c9b178'];const tiles=[],cols=38,rows=38;
function mask(u,v){const px=(u-.5)*2,py=(v-.5)*2;let color=null,prio=0;const circle=(cx,cy,r)=>Math.hypot(px-cx,py-cy)<r,ellipse=(cx,cy,rx,ry)=>((px-cx)/rx)**2+((py-cy)/ry)**2<1;if(circle(-.66,-.55,.16)||circle(.68,.52,.17)||circle(-.72,.54,.12)||circle(.67,-.58,.12)){color=palette[1];prio=1}if(ellipse(-.62,.42,.24,.08)||ellipse(.62,-.42,.25,.08)||ellipse(-.56,-.68,.18,.06)||ellipse(.58,.68,.2,.06)){color=palette[10];prio=1}if(ellipse(0,.08,.34,.42)){color=palette[8];prio=4}if(ellipse(0,-.23,.31,.25)){color=palette[7];prio=6}if(ellipse(0,-.25,.23,.14)){color='#294b49';prio=8}if(circle(-.095,-.26,.035)||circle(.095,-.26,.035)){color='#b9e4d7';prio=10}if(ellipse(0,.12,.23,.27)){color='#d4cbb5';prio=5}if(ellipse(0,.16,.13,.18)){color='#c47b5c';prio=7}if(ellipse(-.32,.10,.13,.25)||ellipse(.32,.10,.13,.25)){color='#ddd4bf';prio=4}if(ellipse(-.16,.46,.15,.09)||ellipse(.16,.46,.15,.09)){color='#6b756a';prio=4}if(ellipse(-.45,.38,.22,.09)){color='#557f67';prio=3}if(ellipse(.45,.38,.22,.09)){color='#6e936e';prio=3}if(ellipse(-.48,.29,.09,.18)){color='#d59677';prio=5}if(ellipse(.48,.30,.09,.18)){color='#d8a06f';prio=5}if(circle(-.62,-.18,.075)||circle(.61,.12,.07)){color='#d98d73';prio=3}return color?{color,prio}:null}
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const u=(i+.5)/cols,v=(j+.5)/rows,m=mask(u,v);if(!m)continue;const px=(u-.5)*2,py=(v-.5)*2,ang=Math.sin(i*.83+j*.37)*.18+(m.prio<3?Math.sin(j*.4)*.25:0);tiles.push({gx:px,gy:py,color:m.color,prio:m.prio,ang,seed:Math.random(),seed2:Math.random(),seed3:Math.random(),delay:0})}tiles.forEach(q=>{const dist=Math.hypot(q.gx*.86,q.gy);q.delay=.05+dist*.34+q.seed*.18-(q.prio>=6?.10:0)});const duration=7.8;
function ease(t){return 1-Math.pow(1-t,3)}function bounce(t){const s=7.5625,p=2.75;if(t<1/p)return s*t*t;if(t<2/p)return s*(t-=1.5/p)*t+.75;if(t<2.5/p)return s*(t-=2.25/p)*t+.9375;return s*(t-=2.625/p)*t+.984375}
function proj(X,Y,Z){const yaw=dragX*.20,pitch=dragY*.12;let xx=X*Math.cos(yaw)-Z*Math.sin(yaw),zz=X*Math.sin(yaw)+Z*Math.cos(yaw),yy=Y*Math.cos(pitch)-zz*Math.sin(pitch);zz=Y*Math.sin(pitch)+zz*Math.cos(pitch);const cam=3.25,sc=Math.min(W,H)*.48/(cam-zz);return{x:W/2+xx*sc,y:H/2+yy*sc,sc,z:zz}}
function poly(points,fill,stroke){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=.65;x.stroke()}}function shade(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return 'rgb('+(Math.max(0,Math.min(255,r*a))|0)+','+(Math.max(0,Math.min(255,g*a))|0)+','+(Math.max(0,Math.min(255,b*a))|0)+')'}
function tile(q,p){const size=1.72/cols,depth=size*.34,targetX=q.gx*.84,targetZ=q.gy*.84,local=Math.max(0,Math.min(1,(p-q.delay)/.42));if(local<=0)return;const e=ease(local),land=bounce(Math.max(0,(local-.62)/.38)),sx=targetX+(q.seed-.5)*2.9*(1-e),sz=targetZ+(q.seed2-.5)*2.8*(1-e),height=(1-e)*(1.15+q.seed3*1.6)+(.62<local?(1-land)*.08:0),rot=q.ang+(1-e)*(q.seed-.5)*5.5,co=Math.cos(rot),si=Math.sin(rot);function pt(dx,dz,h){const rx=dx*co-dz*si,rz=dx*si+dz*co;return proj(sx+rx,-height-h,sz+rz)}const s=size*.46,A=pt(-s,-s,0),B=pt(s,-s,0),C=pt(s,s,0),D1=pt(-s,s,0),A2=pt(-s,-s,depth),B2=pt(s,-s,depth),C2=pt(s,s,depth),D2=pt(-s,s,depth),sh=proj(sx+.025,0,sz+.035);x.save();x.globalAlpha=.12*(.3+.7*e);x.fillStyle='#493e2f';x.beginPath();x.ellipse(sh.x,sh.y,size*sh.sc*.7,size*sh.sc*.28,0,0,Math.PI*2);x.fill();x.restore();poly([D1,C,B,B2,C2,D2],shade(q.color,.72));poly([B,C,C2,B2],shade(q.color,.62));poly([A,B,B2,A2],shade(q.color,.82));poly([A2,B2,C2,D2],q.color,'#ffffff25');x.save();x.globalAlpha=.16;x.strokeStyle='#fff';x.lineWidth=Math.max(.4,size*A2.sc*.035);x.beginPath();x.moveTo(A2.x,A2.y);x.lineTo(B2.x,B2.y);x.stroke();x.restore()}
function bg(){const g=x.createRadialGradient(W*.48,H*.45,20,W*.5,H*.5,Math.max(W,H)*.72);g.addColorStop(0,'#eee5d2');g.addColorStop(1,'#c8bda6');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.globalAlpha=.08;for(let i=0;i<120;i++){const xx=(i*83.7)%W,yy=(i*47.3)%H;x.fillStyle=i%2?'#6f604b':'#fff';x.beginPath();x.arc(xx,yy,(i%3)+.5,0,7);x.fill()}x.restore()}
function frame(now){const elapsed=(now-start)/1000,p=Math.min(1,elapsed/duration);tx+=(0-tx)*.05;ty+=(0-ty)*.05;if(!down){dragX+=(tx-dragX)*.035;dragY+=(ty-dragY)*.035}bg();const sorted=[...tiles].sort((a,b)=>a.gy-b.gy);for(const q of sorted)tile(q,p);bar.style.width=(p*100)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);function replay(){start=performance.now()}document.querySelector('#replay').onclick=replay;c.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!down)return;dragX+=(e.clientX-lastX)/W*2;dragY+=(e.clientY-lastY)/H*2;dragX=Math.max(-1.3,Math.min(1.3,dragX));dragY=Math.max(-.8,Math.min(.8,dragY));lastX=e.clientX;lastY=e.clientY});c.addEventListener('pointerup',()=>{down=false;tx=dragX*.35;ty=dragY*.35});c.addEventListener('dblclick',replay)})();
</script></body></html>

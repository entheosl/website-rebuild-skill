name: Mosaic preview check
on:
  push:
    branches: [main]
    paths:
      - 'demos/agent-runtime/**'
      - '.github/workflows/mosaic-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mosaic-preview
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin and vendor Three.js
        run: |
          mkdir -p /tmp/mosaic-deps
          cd /tmp/mosaic-deps
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund three@0.170.0 playwright@1.56.1
          cd "$GITHUB_WORKSPACE"
          mkdir -p demos/agent-runtime/vendor
          cp /tmp/mosaic-deps/node_modules/three/build/three.module.min.js demos/agent-runtime/vendor/three.module.min.js
          cp /tmp/mosaic-deps/node_modules/three/LICENSE demos/agent-runtime/vendor/THREE-LICENSE.txt
          git add demos/agent-runtime/vendor
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Vendor pinned Three.js r170 for standalone mobile demo'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: three-vendor
          path: demos/agent-runtime/vendor/
          retention-days: 3
      - name: Install test browser
        run: cd /tmp/mosaic-deps && npx playwright install --with-deps chromium
      - name: Capture mobile and desktop renders
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mosaic-server.log 2>&1 &
          mkdir -p /tmp/mosaic-captures
          cat > /tmp/mosaic-deps/check.cjs <<'JS'
          const {chromium} = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox','--enable-webgl','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const report=[];
            for(const size of [{width:390,height:844},{width:844,height:390},{width:1280,height:900}]){
              const page=await browser.newPage({viewport:size,deviceScaleFactor:1,isMobile:size.width<900,hasTouch:size.width<900});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:8765/demos/agent-runtime/',{waitUntil:'networkidle'});
              await page.waitForTimeout(3000);
              const modern=await page.evaluate(()=>typeof window.__mosaicTest==='object');
              for(const t of modern?[2,7,12,17,20,24]:[8]){
                if(modern)await page.evaluate(t=>window.__mosaicTest.seek(t),t);
                else await page.waitForTimeout(5000);
                await page.waitForTimeout(250);
                await page.screenshot({path:`/tmp/mosaic-captures/${size.width}x${size.height}-${t}.png`});
              }
              report.push({size,errors,stats:await page.evaluate(()=>window.__mosaicTest?.stats?.()||{})});
              await page.close();
            }
            fs.writeFileSync('/tmp/mosaic-captures/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(report.some(r=>r.errors.length))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/mosaic-deps/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosaic-mobile-render-check
          path: /tmp/mosaic-captures/
          retention-days: 7

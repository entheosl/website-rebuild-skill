name: Mosaic PBR materials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mosaic-material-sources.yml'
      - 'tools/mosaic-pbr/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mosaic-pbr-materials
  cancel-in-progress: true
env:
  PUBLISH: 'false'
jobs:
  surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare verified material maps and update only the demo
        run: |
          python3 -m pip install --quiet Pillow==11.3.0 numpy==2.2.6
          python3 tools/mosaic-pbr/build_materials.py
          python3 tools/mosaic-pbr/patch_scene.py
          python3 tools/mosaic-pbr/preserve_artwork.py
          mkdir -p /tmp/pbr-test
          cd /tmp/pbr-test
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.170.0 playwright@1.56.1 >/dev/null
          sed "s/from 'three'/from '.\/three.module.min.js'/" node_modules/three/examples/jsm/loaders/RGBELoader.js > "$GITHUB_WORKSPACE/demos/agent-runtime/vendor/RGBELoader.js"
          npx playwright install --with-deps chromium
      - name: Check shader compilation, mobile framing and controls
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pbr-server.log 2>&1 &
          mkdir -p /tmp/pbr-check
          cat > /tmp/pbr-test/check.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const report={build:'mosaic-pbr-r3',checks:[],errors:[]};
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox','--enable-webgl','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            for(const viewport of [{width:390,height:844},{width:844,height:390},{width:1280,height:900}]){
              const page=await browser.newPage({viewport,deviceScaleFactor:1,isMobile:viewport.width<900,hasTouch:true});
              page.on('pageerror',e=>report.errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')report.errors.push(m.text());});
              const failures=[];page.on('response',r=>{if(r.status()>=400)failures.push([r.status(),r.url()]);});
              await page.goto('http://127.0.0.1:8765/demos/agent-runtime/',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>window.__mosaicTest?.stats().ready,{},{timeout:60000});
              for(const t of viewport.width===844?[24]:[2,20,24]){
                await page.evaluate(t=>window.__mosaicTest.seek(t),t);
                await page.screenshot({path:`/tmp/pbr-check/${viewport.width}x${viewport.height}-${t}.png`});
              }
              const stats=await page.evaluate(()=>window.__mosaicTest.stats());
              if(stats.build!=='mosaic-pbr-r3'||stats.materials.type!=='MeshPhysicalMaterial'||!stats.materials.environment||stats.materials.maps.length!==8||stats.artworkCleanup!=='contour-preserving-median')throw Error('Material readiness failed');
              if(stats.tileCount<4000||stats.time!==24||failures.length)throw Error('Scene or resource validation failed');
              const before=await page.locator('#stage canvas').screenshot();
              await page.mouse.move(viewport.width*.5,viewport.height*.5);await page.mouse.down();
              await page.mouse.move(viewport.width*.66,viewport.height*.43,{steps:4});await page.mouse.up();
              await page.waitForTimeout(300);
              const after=await page.locator('#stage canvas').screenshot();
              if(before.equals(after))throw Error('Camera drag is not rendering');
              await page.locator('#replay').click();
              await page.waitForFunction(()=>{const s=window.__mosaicTest.stats();return s.time>0&&s.time<5},{},{timeout:15000});
              await page.locator('#play').click();
              const paused=await page.evaluate(()=>window.__mosaicTest.stats().time);await page.waitForTimeout(300);
              if(await page.evaluate(()=>window.__mosaicTest.stats().time)!==paused)throw Error('Pause did not stop animation');
              report.checks.push({viewport,stats,failures,drag:true,replay:true,pause:true});
              await page.close();
            }
            await browser.close();
            if(report.errors.length)throw Error(report.errors.join('\n'));
            fs.writeFileSync('/tmp/pbr-check/report.json',JSON.stringify(report,null,2));
          })().catch(e=>{report.errors.push(e.message);fs.writeFileSync('/tmp/pbr-check/report.json',JSON.stringify(report,null,2));console.error(e);process.exit(1);});
          JS
          node /tmp/pbr-test/check.cjs
      - name: Preserve the exact staged website for visual review
        if: always()
        run: |
          mkdir -p /tmp/pbr-check/site
          cp -R demos/agent-runtime/. /tmp/pbr-check/site/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosaic-pbr-checked
          path: /tmp/pbr-check/
          retention-days: 7
      - name: Publish inspected and tested PBR assets
        if: env.PUBLISH == 'true'
        run: |
          git add demos/agent-runtime/index.html demos/agent-runtime/assets/pbr demos/agent-runtime/vendor/RGBELoader.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Upgrade mosaic to CC0 PBR glaze, plaster, wood and HDR studio lighting'
            git push
          fi
